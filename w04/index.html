<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Board Game Collector</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h1 { color: #2c3e50; text-align: center; }
    .card-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; }
    .card { background: #fff; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; transition: 0.2s; cursor: pointer; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.1); border-color: #3498db; }
    .card h3 { margin: 0 0 10px 0; color: #2980b9; }
    .badge { background: #e8f4f8; color: #2980b9; padding: 4px 8px; border-radius: 4px; font-size: 0.85em; font-weight: bold; }
    .btn-back { background: #7f8c8d; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; }
    .btn-back:hover { background: #95a5a6; }
    .detail-box { border-left: 4px solid #3498db; padding-left: 15px; margin-top: 15px; }
    .detail-item { margin: 10px 0; font-size: 1.05em; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <!-- หน้า 1: แสดงรายการทั้งหมด (List View) -->
    <div id="list-view">
      <h1> คลังสะสมบอร์ดเกม (Board Game Collector)</h1>
      <p style="text-align:center; color:#666;">คลิกที่การ์ดเพื่อดูรายละเอียดเฉพาะของแต่ละเกม</p>
      <div class="card-list" id="game-container"></div>
    </div>

    <!-- หน้า 2: แสดงข้อมูลเฉพาะ (Detail View) -->
    <div id="detail-view" class="hidden">
      <button class="btn-back" onclick="showList()">← ย้อนกลับไปหน้าหลัก</button>
      <h1 id="detail-title">ชื่อเกม</h1>
      <div class="detail-box">
        <div class="detail-item"><strong>1. หมวดหมู่ (Category):</strong> <span id="detail-category"></span></div>
        <div class="detail-item"><strong>2. จำนวนผู้เล่น (Players):</strong> <span id="detail-players"></span></div>
        <div class="detail-item"><strong>3. ระยะเวลาเล่น (Playtime):</strong> <span id="detail-time"></span></div>
        <div class="detail-item"><strong>4. คะแนนความชอบ (Rating):</strong> <span id="detail-rating"></span></div>
        <div class="detail-item"><strong>5. รายละเอียดเพิ่มเติม (Description):</strong> <span id="detail-desc"></span></div>
      </div>
    </div>
  </div>

  <script>
    // ข้อมูลบอร์ดเกม 5 รายการ มีคุณสมบัติ 5 อย่างขึ้นไป
    const games = [
      { id: 1, title: 'Catan', category: 'Strategy / Resource Management', players: '3-4 คน', time: '60-120 นาที', rating: '★ 4.5 / 5.0', desc: 'เกมกระดานวางแผนสะสมทรัพยากร เพื่อสร้างถนน บ้าน และเมืองบนเกาะคาทาน' },
      { id: 2, title: 'Ticket to Ride', category: 'Family / Strategy', players: '2-5 คน', time: '30-60 นาที', rating: '★ 4.0 / 5.0', desc: 'เกมเชื่อมต่อเส้นทางรถไฟข้ามเมือง สนุก เข้าใจง่าย เหมาะกับเล่นทั้งครอบครัว' },
      { id: 3, title: 'Splendor', category: 'Engine Building / Card Drafting', players: '2-4 คน', time: '30 นาที', rating: '★ 4.8 / 5.0', desc: 'เกมสวมบทบาทพ่อค้าเพชร สะสมอัญมณีเพื่อซื้อการ์ดและทำคะแนน' },
      { id: 4, title: 'Wingspan', category: 'Engine Building / Medium Heavy', players: '1-5 คน', time: '40-70 นาที', rating: '★ 4.9 / 5.0', desc: 'เกมดึงดูดนกชนิดต่างๆ เข้าสู่นิเวศวิทยา มีคอมโบการ์ดที่ลึกซึ้งและภาพสวยงาม' },
      { id: 5, title: 'Exploding Kittens', category: 'Party / Push Your Luck', players: '2-5 คน', time: '15 นาที', rating: '★ 3.8 / 5.0', desc: 'การ์ดเกมสายฮา เอาชีวิตรอดจากการจูดเหมียวยกแก๊ง เล่นง่ายและรวดเร็ว' }
    ];

    // ฟังก์ชันสร้างรายการการ์ดในหน้า List View
    function renderList() {
      const container = document.getElementById('game-container');
      container.innerHTML = games.map(game => `
        <div class="card" onclick="showDetail(${game.id})">
          <h3>${game.title}</h3>
          <p><span class="badge">${game.category.split('/')[0]}</span></p>
          <p>👥 ${game.players}</p>
          <p>⭐ ${game.rating}</p>
        </div>
      `).join('');
    }

    // ฟังก์ชันเปิดหน้า Detail View
    function showDetail(id) {
      const game = games.find(g => g.id === id);
      if (!game) return;

      document.getElementById('detail-title').innerText = game.title;
      document.getElementById('detail-category').innerText = game.category;
      document.getElementById('detail-players').innerText = game.players;
      document.getElementById('detail-time').innerText = game.time;
      document.getElementById('detail-rating').innerText = game.rating;
      document.getElementById('detail-desc').innerText = game.desc;

      document.getElementById('list-view').classList.add('hidden');
      document.getElementById('detail-view').classList.remove('hidden');
    }

    // ฟังก์ชันย้อนกลับไปหน้า List View
    function showList() {
      document.getElementById('detail-view').classList.add('hidden');
      document.getElementById('list-view').classList.remove('hidden');
    }

    // เริ่มต้นแสดงผลหน้า List
    renderList();
  </script>
</body>
</html>
